name: CI og deploy

# Hver push til main testes og udgives på GitHub Pages.
# Kræver at Pages er slået til: Settings → Pages → Source: GitHub Actions.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install Playwright browser
        run: |
          for i in 1 2 3; do
            npx playwright install --with-deps chromium && exit 0
            echo "Attempt $i failed, retrying in 30 s"
            sleep 30
          done
          echo "::warning::Ubuntu packages unavailable - installing Chromium without system packages"
          npx playwright install chromium
      - run: npm run test:e2e
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
